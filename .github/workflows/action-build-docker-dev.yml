name: Build and Deploy Docker Image Dev

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh

    - name: Connect to Tailscale
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        sudo tailscale up --authkey=${TAILSCALE_AUTH_KEY}

    - name: Check server reachability
      run: ping -c 4 ${{ secrets.SSH_HOST }}


    - name: Debug SSH connection
      run: |
        ssh -vvv -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}


    - name: Execute Docker commands on server
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd cd ~/works
          docker rmi $(docker images focus-flow-image -q)
          docker build --no-cache -t focus-flow-image:dev -f Dockerfile-dev .
          docker compose up -d --build focus-flow-dev
        EOF


